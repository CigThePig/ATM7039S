<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATM7039S Lab</title>
<style>
:root { --bg:#f6f7f9; --card:#fff; --ink:#1b1f24; --muted:#5b6470; --line:#d9dde3; --go:#116b3a; --go-bg:#e6f4ea;
        --stop:#a1260d; --stop-bg:#fdecea; --wait:#8a5a00; --wait-bg:#fff4d6; --accent:#1f5fbf; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#15181c; --card:#1e2227; --ink:#e8eaed; --muted:#a4abb5;
        --line:#343a42; --go:#6fd394; --go-bg:#183324; --stop:#ff8c75; --stop-bg:#3a1d18; --wait:#f3c766; --wait-bg:#3a3018; --accent:#8ab4ff; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font: 18px/1.5 system-ui, "Segoe UI", sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 16px; }
h1 { font-size: 22px; margin: 8px 0 4px; } h2 { font-size: 26px; margin: 4px 0 12px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; margin:14px 0; }
.muted { color:var(--muted); font-size:15px; }
.steps { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; }
.dot { width:22px; height:8px; border-radius:4px; background:var(--line); }
.dot.complete { background:var(--go); } .dot.current { background:var(--accent); } .dot.blocked { background:var(--stop); }
button { font: inherit; padding: 12px 20px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color:var(--ink); cursor:pointer; }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
button:disabled { opacity: .45; cursor: default; }
label.check { display:flex; gap:12px; align-items:flex-start; padding:10px 0; border-bottom:1px solid var(--line); cursor:pointer; }
label.check input { width:26px; height:26px; flex:none; margin-top:2px; }
.bar { height:18px; background:var(--line); border-radius:9px; overflow:hidden; margin:10px 0; }
.bar > div { height:100%; background:var(--accent); transition: width .4s; }
.bar.unknown > div { width:30%; animation: slide 1.6s infinite linear; }
@keyframes slide { from { margin-left:-30%; } to { margin-left:100%; } }
.problem { border-color: var(--stop); background: var(--stop-bg); }
.ok { border-color: var(--go); background: var(--go-bg); }
.badge { display:inline-block; padding:2px 10px; border-radius:20px; font-size:14px; font-weight:600; }
.badge.physical { background:var(--wait-bg); color:var(--wait); } .badge.computer { background:var(--go-bg); color:var(--go); }
code, .path { font-family: ui-monospace, Consolas, monospace; font-size: 15px; word-break: break-all; }
.row { display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
ul.lines { padding-left: 20px; font-size:16px; } details { margin-top: 10px; }
</style>
</head>
<body>
<main>
  <h1>ATM7039S hardware test lab</h1>
  <div class="muted" id="sub">Connecting…</div>
  <div id="app"></div>
</main>
<script>
const TOKEN = "__TOKEN__";
let S = null, ticks = {};
async function post(path, body) {
  const r = await fetch('/api/' + path, {method:'POST', headers:{'Content-Type':'application/json','X-Lab-Token':TOKEN}, body: JSON.stringify(body||{})});
  const j = await r.json();
  if (!r.ok) { alert(j.error || 'Something went wrong'); return null; }
  if (j.session !== undefined) { S = j; render(); }
  return j;
}
function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function bytes(n) { if (n == null) return '?'; const u=['B','KB','MB','GB']; let i=0; while (n>=1000 && i<3) { n/=1000; i++; } return n.toFixed(i?1:0)+' '+u[i]; }
function dur(s) { if (s == null) return ''; s=Math.round(s); return s<60 ? s+' s' : s<3600 ? Math.round(s/60)+' min' : (s/3600).toFixed(1)+' h'; }
function progress(j) {
  if (!j) return '';
  const known = j.percent != null;
  const amount = j.unit === 'bytes' ? `${bytes(j.done)}${j.total ? ' of ' + bytes(j.total) : ''}` : `${j.done.toLocaleString()}${j.total ? ' of about ' + j.total.toLocaleString() : ''} ${j.unit}`;
  const rate = j.rate_per_s ? (j.unit === 'bytes' ? ` · ${bytes(j.rate_per_s)}/s` : ` · ${Math.round(j.rate_per_s)}/s`) : '';
  const eta = j.eta_s != null ? ` · about ${dur(j.eta_s)} left` : '';
  return `<div><b>${esc(j.phase)}</b>${j.state==='paused' ? ' — <b>paused</b>' : ''}</div>
    <div class="bar ${known?'':'unknown'}"><div style="width:${known? j.percent : 30}%"></div></div>
    <div class="muted">${known ? j.percent.toFixed(0)+'% · ' : ''}${amount}${rate}${eta}</div>
    <div class="muted">Still working: last update ${j.heartbeat_age_s}s ago · ${j.mode==='quiet' ? 'quiet mode (you can keep using the computer)' : 'fast mode'}</div>
    ${j.message ? `<div class="muted">${esc(j.message)}</div>` : ''}
    <div class="row">${j.state==='paused' ? `<button onclick="post('control',{what:'resume'})">Continue</button>` : `<button onclick="post('control',{what:'pause'})">Pause</button>`}
      <button onclick="post('control',{what:'cancel'})">Stop (keeps finished work)</button>
      <button onclick="post('control',{what:'${j.mode==='quiet'?'mode-fast':'mode-quiet'}'})">${j.mode==='quiet'?'Go faster':'Go quieter'}</button></div>`;
}
function render() {
  const app = document.getElementById('app');
  if (!S) return;
  document.getElementById('sub').textContent = `Lab ${S.version}` + (S.session ? ` · session ${S.session.id}` : '');
  if (!S.session) {
    app.innerHTML = `<div class="card"><h2>Welcome</h2><p>This lab guides you through hardware test V3 one step at a time.
      The computer does all the checking. You only do what needs hands: cards, buttons and the handheld.</p>
      <p>You can stop at any point and come back later; your progress is saved.</p>
      <div class="row"><button class="primary" onclick="post('new-session')">Start a test session</button></div></div>`;
    return;
  }
  const ss = S.session, steps = ss.steps, cur = steps.find(s => s.id === ss.current), n = steps.indexOf(cur) + 1;
  let h = `<div class="steps">${steps.map(s => `<div class="dot ${s.status==='complete'?'complete':s.id===ss.current?(s.status==='blocked'?'blocked':'current'):''}" title="${esc(s.title)}"></div>`).join('')}</div>`;
  h += `<div class="card"><div class="muted">Step ${n} of ${steps.length}</div><h2>${esc(cur.title)}</h2>
        <span class="badge ${cur.kind==='physical'?'physical':'computer'}">${cur.kind==='physical'?'You do this':cur.kind==='computer'?'The computer does this':'Review'}</span>`;
  if (cur.short) h += `<p>${esc(cur.short)}</p>`;
  if (cur.kind === 'physical') {
    if (cur.id === 'flash' && S.extra.flash) {
      const f = S.extra.flash;
      h += `<p>1. Open <b>balenaEtcher</b>. 2. <b>Flash from file</b> and choose this file:</p><p class="path">${esc(f.image)}</p>
            <button id="copy-image-path">Copy the file path</button>
            <p>3. <b>Select target</b>: choose the spare card. Removable disks connected now:</p>
            <ul>${f.removable.map(d => `<li>${esc(d.model)} — ${d.size_gb} GB (${esc(d.bus)})</li>`).join('') || '<li>none found: is the card inserted?</li>'}</ul>
            <p>${f.target_unique ? 'Check that the single disk is your marked spare card before pressing Flash.' : '<b>STOP:</b> ' + esc(f.access_problem || 'No unique removable target or firmware image is available. Do not flash.')} 4. Press <b>Flash</b> only after confirming the target and wait for “Flash Complete!”.
            If Windows then asks to format a disk, press <b>Cancel</b>.</p>`;
    }
    h += `<form id="cl">${cur.checklist.map((c,i) => `<label class="check"><input type="checkbox" data-i="${i}"><span>${esc(c)}</span></label>`).join('')}</form>
          <div class="row"><button class="primary" id="done" disabled>Done</button></div>`;
  } else if (cur.kind === 'computer') {
    if (S.busy) h += progress(S.job);
    else {
      const label = cur.status === 'blocked' ? 'Try again' : (cur.confirm || 'Start');
      h += `<div class="row"><button class="primary" onclick="post('run',{step:'${cur.id}'})">${esc(label)}</button></div>`;
    }
  } else {
    h += `<p>Results are in the session folder on this computer. Send only <code>summary.md</code> / <code>summary.json</code>; keep the <code>private</code> folder private.</p>
          <div class="row"><button class="primary" onclick="post('finish')">Close this session</button></div>`;
  }
  h += `</div>`;
  if (S.problem) h += `<div class="card problem"><h2>${esc(S.problem.title)}</h2><p>${esc(S.problem.what)}</p>
        <p><b>Was anything lost?</b> ${esc(S.problem.lost)}</p><p><b>Is it safe?</b> ${esc(S.problem.safe)}</p>
        <p><b>What next?</b> ${esc(S.problem.next)}</p>${S.problem.bundle ? `<p class="muted">Diagnostic bundle: <span class="path">${esc(S.problem.bundle)}</span></p>` : ''}</div>`;
  else if (!S.busy && S.lines.length) h += `<div class="card ok"><div class="muted">Result of the last check</div><ul class="lines">${S.lines.map(l => `<li>${esc(l)}</li>`).join('')}</ul></div>`;
  h += `<details><summary>More options</summary><div class="row">
        <button onclick="bundle()">Make a diagnostic bundle</button>
        <button onclick="back()">Go back to an earlier step…</button>
        <button onclick="if(confirm('Start a new session? The current one is kept on disk.')) post('new-session')">Start a new session</button></div>
        <p class="muted">Done so far: ${steps.filter(s=>s.status==='complete').map(s=>esc(s.title)).join(' · ') || 'nothing yet'}</p>
        ${ss.deviations.length ? `<p class="muted">Recorded deviations: ${ss.deviations.length}</p>` : ''}</details>`;
  app.innerHTML = h;
  const copyPath = document.getElementById('copy-image-path');
  if (copyPath) copyPath.onclick = async () => {
    try { await navigator.clipboard.writeText(S.extra.flash.image); copyPath.textContent = 'Copied'; }
    catch { alert('Clipboard unavailable. Select and copy the displayed path manually.'); }
  };
  const form = document.getElementById('cl');
  if (form) {
    const boxes = [...form.querySelectorAll('input')], done = document.getElementById('done');
    const prev = ticks[cur.id] || []; boxes.forEach((b,i) => b.checked = !!prev[i]);
    const upd = () => { ticks[cur.id] = boxes.map(b => b.checked); done.disabled = !boxes.every(b => b.checked) || (cur.id === 'flash' && !S.extra.flash?.target_unique); };
    boxes.forEach(b => b.onchange = upd); upd();
    done.onclick = () => { post('confirm', {step: cur.id, answers: boxes.map(b => b.checked)}); delete ticks[cur.id]; };
  }
}
async function bundle() { const j = await post('bundle'); if (j && j.path) alert('Saved: ' + j.path + '\nReview every file in the ZIP for private information before sharing.'); }
function back() {
  const ids = S.session.steps.filter(s => s.status==='complete').map(s => s.id);
  const id = prompt('Which step? (' + ids.join(', ') + ')'); if (!id) return;
  const why = prompt('Why are you going back? (kept with the results)'); if (!why) return;
  post('back', {step:id, reason:why});
}
async function poll() {
  try { const r = await fetch('/api/state'); S = await r.json();
        const typing = document.activeElement && document.activeElement.tagName === 'INPUT';
        if (!typing) render();
        if (S.session && !S.busy) { const c = S.session.steps.find(s => s.id === S.session.current);
          if (c.kind === 'computer' && c.status === 'ready' && !c.confirm && !S.problem) post('run', {step: c.id}); } }
  catch (e) { document.getElementById('sub').textContent = 'The lab window was closed. Start it again to continue; your progress is saved.'; }
  setTimeout(poll, S && S.busy ? 1000 : 2000);
}
poll();
</script>
</body>
</html>
