name: Research integrity
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt -r requirements-firmware.txt
      # Shell portability checks for device/capture.sh (tests/test_capture_shells.py).
      - run: sudo apt-get install -y --no-install-recommends busybox dash
      - run: python -m pip install shellcheck-py==0.10.0.1
      - run: python -m unittest discover -s tests -v
      - run: python tools/research.py validate
      - run: python tools/research.py generate --check
      - run: python tools/render_catalogue.py
      - run: git diff --exit-code -- evidence/catalogue.md evidence/findings.md
      - run: python tools/render_html.py
      - uses: actions/upload-artifact@v4
        with:
          name: technical-reference-html
          path: site/

  windows-operator-validation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt -r requirements-firmware.txt
      - run: python -m unittest discover -s tests -p test_v3_preflight.py -v

      - run: python -m unittest discover -s tests -p test_v3_rootfs_review.py -v
