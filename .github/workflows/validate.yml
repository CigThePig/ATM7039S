name: Research integrity
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt -r requirements-firmware.txt
      # Shell portability checks for device/capture.sh (tests/test_capture_shells.py).
      - run: sudo apt-get install -y --no-install-recommends busybox dash
      - run: python -m pip install shellcheck-py==0.10.0.1
      - run: python -m unittest discover -s tests -v
      - name: Lab launcher self-test (fresh venv, as the operator runs it)
        run: ./start-lab.sh selftest
      - run: python tools/research.py validate
      - run: python tools/research.py generate --check
      - run: python tools/render_catalogue.py
      - run: git diff --exit-code -- evidence/catalogue.md evidence/findings.md
      - run: python tools/render_html.py
      - uses: actions/upload-artifact@v4
        with:
          name: technical-reference-html
          path: site/

  windows-operator-validation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt -r requirements-firmware.txt
      - run: python -m unittest discover -s tests -p test_v3_preflight.py -v
      - run: python -m unittest discover -s tests -p test_v3_rootfs_review.py -v
      # Lab: state machine, downloads, simulated Windows storage and a simulated V3 session (not hardware tests).
      - run: python -m unittest discover -s tests -p test_lab.py -v
      # Packaging and start-up exactly as the operator runs it: project-local venv, no administrator rights.
      - name: Launcher creates its environment and passes the self-test (non-admin, path with spaces)
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'ATM7039S Lab ü'
          Copy-Item -Recurse -Path $PWD -Destination $dest
          Set-Location $dest
          cmd /c "ATM7039S-Lab.cmd selftest < NUL"
          if ($LASTEXITCODE -ne 0) { throw "launcher self-test failed ($LASTEXITCODE)" }
      - name: PowerShell scripts parse
        shell: pwsh
        run: |
          foreach ($f in @('tools/v3_operator.ps1')) {
            $errs = $null; [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errs)
            if ($errs) { $errs | Format-List; throw "parse errors in $f" }
          }
      - name: Windows disk inventory command runs without administrator rights
        shell: pwsh
        run: python -c "import sys; sys.path.insert(0,'tools'); from v3lab import disks; d=disks.collect(); print(len(d),'disks'); print(disks.public_view(disks.identify(d))['status'])"

